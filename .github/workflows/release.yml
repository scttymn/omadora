# Tagging vX.Y.Z builds the engine for Linux and attaches it to a GitHub
# release. Then `make pin VERSION=X.Y.Z` checks the binaries and records
# their SHA-256 in engine-release.json, and the widget downloads that
# release on first run.
#
# Actions are pinned to exact commits, and only the job that publishes can
# write to the repository: the build runs third-party code (the toolchain
# action, crates' build scripts) with read access only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  engine:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ALSA for playback. Ubuntu 22.04's older glibc keeps the binary
      # running on older systems as well as current Arch.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked --manifest-path engine/Cargo.toml
      - name: Package
        run: |
          name="omadora-engine-${{ matrix.arch }}-linux"
          cp engine/target/release/omadora-engine "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-${{ matrix.arch }}
          path: omadora-engine-*

  release:
    needs: engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" omadora-engine-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Omadora $GITHUB_REF_NAME" \
            --notes "The Omadora engine for Linux. The widget downloads it on first run and checks it against the SHA-256 in engine-release.json."
