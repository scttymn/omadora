[package]
name = "omadora-engine"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Pandora engine for the Omadora player"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls"] }
serde_json = "1"
blowfish = "0.9"
hex = "0.4"
urlencoding = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-mp3", "wav"] }
feed-rs = "3.0.0"
toml = "1.1.8"
